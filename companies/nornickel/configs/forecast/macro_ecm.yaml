# Макро-прогноз для Норникель — VECM + Mean Reversion для LME металлов
# Аналитик настраивает факторы здесь, движок автоматически подбирает метод

run:
  use_log: true
  require_span_years: 10
  window:
    start_year_required: 2009
    require_min_history_years: 10
  max_lag: 2
  criterion: aic
  resid_ar1: true
  johansen_alpha: 0.05
  output_dir: companies/nornickel_v2/outputs/macro_forecast

frequency:
  target: Y
  aggregation: avg
  annual:
    enable: true
    method: mean

factors:
  # ── Commodity prices (Mean Reversion) ──
  - id: lme_ni_usd
    display: "LME Nickel (USD/t)"
    anchor: level
    transform: log
    category: commodity
  - id: lme_cu_usd
    display: "LME Copper (USD/t)"
    anchor: level
    transform: log
    category: commodity
  - id: lme_pd_usd
    display: "LME Palladium (USD/oz)"
    anchor: level
    transform: log
    category: commodity
  - id: lme_pt_usd
    display: "LME Platinum (USD/oz)"
    anchor: level
    transform: log
    category: commodity
  - id: brent_usd
    display: "Brent (USD/bbl)"
    anchor: level
    transform: log
    category: commodity

  # ── FX & Rates ──
  - id: usd_rub
    display: "USD/RUB"
    anchor: level
    transform: log
    category: fx
  - id: cbr_key_rate
    display: "CBR Key Rate (%)"
    anchor: level
    transform: none
    category: rate

  # ── Inflation ──
  - id: cpi_ru
    display: "CPI Russia (index)"
    anchor: trend
    transform: log_diff
    category: inflation
  - id: ppi_ru
    display: "PPI Russia (index)"
    anchor: trend
    transform: log_diff
    category: inflation

  # ── Growth ──
  - id: gdp_world
    display: "GDP World"
    anchor: trend
    transform: log
    category: growth
  - id: gdp_ru
    display: "GDP Russia (real)"
    anchor: trend
    transform: log
    category: growth

vecm:
  groups:
    - name: metals_prices
      factors: [lme_ni_usd, lme_cu_usd, brent_usd]
    - name: pgm_prices
      factors: [lme_pd_usd, lme_pt_usd]
    - name: inflation_block
      factors: [cpi_ru, ppi_ru]
    - name: growth_block
      factors: [gdp_world, gdp_ru]
  horizon_periods: 5
  deterministic_terms: ci
  rank: auto
  lag_order_select: true

fallback:
  chain: [vecm, var, arima011, rw]
  conditions:
    vecm_min_span_years: 10
    vecm_min_rank: 1
  var:
    criterion: aic
    max_lag: 4
  arima011:
    force: true
  rw:
    drift: false

io:
  logs:
    run_report: companies/nornickel_v2/outputs/logs/vecm_run_report.md
