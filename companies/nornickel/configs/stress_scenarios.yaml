# ═══════════════════════════════════════════════════════════════
# Stress Scenarios — Nornickel (PJSC MMC Norilsk Nickel)
# ═══════════════════════════════════════════════════════════════
# Factor names MUST match macro_forecast keys (PG registry factor_id)
# Use: lme_ni_usd, lme_cu_usd, lme_pd_usd, lme_pt_usd, brent_usd, usd_rub

scenarios:

  nickel_downturn:
    description: "LME Nickel -25%, WC deterioration"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: -25.0
    driver_shocks:
      dso_days:
        type: percentage
        value: 15.0
      dih_days:
        type: percentage
        value: 20.0

  pgm_crash:
    description: "Palladium -35%, Platinum -20% (EV transition)"
    macro_shocks:
      lme_pd_usd:
        type: percentage
        value: -35.0
      lme_pt_usd:
        type: percentage
        value: -20.0
    driver_shocks:
      dih_days:
        type: percentage
        value: 15.0

  metals_bear:
    description: "All metals -20%, global slowdown"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: -20.0
      lme_cu_usd:
        type: percentage
        value: -20.0
      lme_pd_usd:
        type: percentage
        value: -20.0
      lme_pt_usd:
        type: percentage
        value: -15.0
    driver_shocks:
      dso_days:
        type: percentage
        value: 10.0

  fx_shock:
    description: "RUB devaluation +30% — costs up, USD revenue flat"
    macro_shocks:
      usd_rub:
        type: percentage
        value: 30.0

  energy_spike:
    description: "Energy +40%, oil +30% — smelter costs up"
    macro_shocks:
      brent_usd:
        type: percentage
        value: 30.0
    driver_shocks:
      cogs_pct:
        type: pp
        value: 3.0

  rate_spike:
    description: "CBR rate +200bp — interest burden up"
    driver_shocks:
      avg_rate:
        type: pp
        value: 2.0

  sanctions_shock:
    description: "LME ban — Ni -30%, Cu -15%, Pd -25%, FX +20%"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: -30.0
      lme_cu_usd:
        type: percentage
        value: -15.0
      lme_pd_usd:
        type: percentage
        value: -25.0
      usd_rub:
        type: percentage
        value: 20.0
    driver_shocks:
      dso_days:
        type: percentage
        value: 25.0
      dih_days:
        type: percentage
        value: 30.0

  severe:
    description: "Combined: metals -30%, rates +300bp, WC stress, FX +15%"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: -30.0
      lme_cu_usd:
        type: percentage
        value: -25.0
      lme_pd_usd:
        type: percentage
        value: -30.0
      lme_pt_usd:
        type: percentage
        value: -20.0
      usd_rub:
        type: percentage
        value: 15.0
    driver_shocks:
      avg_rate:
        type: pp
        value: 3.0
      dso_days:
        type: percentage
        value: 20.0
      dih_days:
        type: percentage
        value: 25.0

  upside:
    description: "Metals +20%, EV demand for Ni/Pd"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: 20.0
      lme_cu_usd:
        type: percentage
        value: 15.0
      lme_pd_usd:
        type: percentage
        value: 25.0
      lme_pt_usd:
        type: percentage
        value: 15.0

  demand_shock:
    description: "Global recession — metals -15%, WC deterioration"
    macro_shocks:
      lme_ni_usd:
        type: percentage
        value: -15.0
      lme_cu_usd:
        type: percentage
        value: -12.0
      lme_pd_usd:
        type: percentage
        value: -15.0
    driver_shocks:
      dso_days:
        type: percentage
        value: 20.0
      dih_days:
        type: percentage
        value: 25.0
