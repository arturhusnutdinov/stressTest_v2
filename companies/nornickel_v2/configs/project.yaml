solver:
  max_iter: 10
  tol: 1000.0
outputs:
  base: companies/nornickel_v2/outputs
features:
  min_cash: 0
forecast_methods:
  is:
    asset_impairment:
      method: ewa
      ewa_halflife_years: 3
    restructuring:
      method: zero
    earnings_from_investees:
      method: ewa
      ewa_halflife_years: 3
    net_periodic_benefit_income:
      method: ewa
      ewa_halflife_years: 3
    loss_on_debt_extinguishment:
      method: zero
    interest_income:
      method: ewa
      ewa_halflife_years: 2
    other_financial_costs:
      method: ewa
      ewa_halflife_years: 3
  bs:
    goodwill:
      method: last
    restricted_cash:
      method: last
    employee_benefits:
      method: ewa
      ewa_halflife_years: 5
covenants:
  enabled: true
  methodology: default
  warning_buffer: 0.1
  acceleration_triggers:
  - interest_coverage
  - net_debt_ebitda
  thresholds:
    net_debt_ebitda_max: 4.5
    interest_coverage_min: 2.0
    debt_to_equity_max: 4.0
    current_ratio_min: 1.0
    ebitda_margin_min: 0.05
rating:
  methodology: sp
  industry_adjustment: -12.0
  size_adjustment: 2.0
  cycle_avg_ebitda_margin: 0.45
  sovereign_rating: BBB+
  weights:
    leverage: 0.35
    coverage: 0.3
    profitability: 0.2
    liquidity: 0.15
