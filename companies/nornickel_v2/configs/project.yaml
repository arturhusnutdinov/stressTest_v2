company:
  name: PJSC MMC Norilsk Nickel
  industry: metals
  currency: USD
  accounting_standard: IFRS
accounting_conventions:
  da_in_cogs: false
macro_forecast:
  profile: vecm_default
  config: companies/nornickel_v2/configs/forecast/macro_ecm.yaml
  factors:
  - brent_usd
  - gdp_world
  - lme_ni_usd
  - lme_cu_usd
  - lme_pd_usd
  - lme_pt_usd
  - usd_rub
  - cpi_ru
  - ppi_ru
  policy:
    factors: []
  search_paths:
  - companies/nornickel_v2/drivers
  - companies/nornickel_v2/data/macro
  - macro/global/drivers
model:
  engine_version: v2
  mode: custom
  standard:
    periods:
      history_start_year: 2010
      history_end_year: 2025
      forecast_start_year: 2026
      forecast_end_year: 2028
      forecast_years: 3
    transforms:
      revenue_target: dln
      revenue_features: dln
    revenue:
      driver: lme_ni_usd
      macro_factors:
      - lme_ni_usd
      - lme_pd_usd
      - gdp_world
      elasticity: 1.0
      use_elastic_net: true
      l1_ratio: 0.5
      fallback_growth: ewa
      target_transform: dln
      feature_transform: dln
      chainlink_anchor: history_last
      segment_modeling: true
    ewa:
      sgna_halflife_years: 3
      wc_days_halflife_years: 3
    sgna:
      base_method: ewa
      ewa_halflife_years: 3
    margins:
      ebitda_margin_default: 0.45
      tax_rate_delta_pct: 0.0
    capex_policy:
      method: ratio_to_revenue
      ratio_default: 0.08
      maint_as_dep_ratio: 1.0
      capex_useful_life_years: 20.0
      disposals_ratio: history
    ppe:
      mode: full
      useful_life_years: 15
      min_capex_da_ratio: 0.9
      sustaining_capex_da_ratio: 0
      expansion_capex_pct_of_rev_growth: 0.0
    wc:
      method: days
      # dio_days calculated by preprocessor from history (NNK ~200 days)
      transform_days: dln
    cogs:
      use_ppi_uplift: false
      clamp:
        min: 0.55
        max: 0.95
    leases:
      enabled: true
      default_discount_rate: 0.05
    debt:
      mode: optimizer
      target_pct_revenue: 0.5
      version: v2_solver
      interest_treatment: separate_line
      target_net_debt_ebitda: 0.0
      max_voluntary_prepay_pct_fcf: 0.5
      rc:
        enable: false
        limit: 0
        min_cash: 300000000
      iter_max: 50
      tol: 1.0e-06
      refinancing:
        enable: true
        mode: simple
        simple:
          extend_years: 5
          rate_adjustment: 0.0
          fees_pct: 0.001
      absorb_nonmodeled_st_debt: true
      general_rate_delta_pct: 0.0
    taxes:
      mode: full
      policy: statutory_with_floor
      nol_opening_balance: 0
      nol_max_utilization_pct: 0.8
      tax_paid_timing: current_year
    intangibles:
      mode: full
      additions_pct_of_revenue: 0.005
      amortization_pct_of_balance: 5.0
    interest_payable:
      mode: full
      payment_timing: current_year
    equity:
      mode: full
      dividend_payout_ratio: 0.75
      buyback_pct_fcf: 0.0
      buyback_leverage_max: 2.0
    train_test:
      train_end_year: 2022
  custom:
    revenue:
      macro_factor: lme_ni_usd
      segment_modeling: true
      segments:
        nickel:
          volume_method: ewa
          price_method: macro
          ewa_halflife: 4.0
