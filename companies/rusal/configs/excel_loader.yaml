# ═══════════════════════════════════════════════════════════════
# UC RUSAL — Excel Loader Configuration
# ═══════════════════════════════════════════════════════════════
# Source: companies/rusal/data/rusal_complete_v5.xlsx (v5: 2025 FS data, intangibles fix, BS validation)
# Format: Legacy wide (metric × years), unit = mUSD
#
# Usage:
#   from engine.loader.excel import ExcelLoader
#   from engine.database.repository import Repository
#   from engine import DB_PATH
#
#   with Repository(DB_PATH) as repo:
#       loader = ExcelLoader(
#           company_id="rusal", repo=repo,
#           db_unit="USD", input_default_unit="mUSD",
#       )
#       result = loader.load(Path("companies/rusal/data/rusal_unified_complete.xlsx"))

loader_settings:
  company_id: rusal
  db_unit: USD
  input_default_unit: mUSD      # Excel values in millions USD → ×1e6 → full USD in DB

# ─── Statement Sheets (legacy wide: metric | 2011 | 2012 | ... | unit) ──────

history:
  IS:
    sheet: history_is
    format: legacy
    required_metrics:
      - revenue
      - cogs
      - gross_profit
      - sga
      - ebitda
      - ebit
      - ebt
      - tax_expense
      - net_income
    key_optional:
      - dep_ppe
      - amort_intangibles
      - total_da
      - interest_expense
      - interest_income
      - earnings_from_investees
      - asset_impairment
      - distribution_expenses
      - current_tax
      - deferred_tax
      - ebitda_standard

  BS:
    sheet: history_bs
    format: legacy
    required_metrics:
      - cash
      - accounts_receivable
      - inventory
      - ppe_net
      - short_term_debt
      - long_term_debt
      - accounts_payable
      - retained_earnings
      - total_assets
      - total_equity
    key_optional:
      # Current Assets
      - restricted_cash
      - other_ca                    # → alias: other_current_assets
      - other_ca_tax                # → merge into other_current_assets
      - total_current_assets        # subtotal (computed if missing)
      # Non-Current Assets
      - ppe_gross
      - ppe_accum_dep
      - investments_lt              # → alias: investments_and_long_term_receivables
      - investments_in_associates
      - intangibles                 # CONVENTION: other intangibles only (excl. goodwill)
      - goodwill                    # separate from intangibles — bs_totals sums both
      - rou_asset                   # CONVENTION: ppe_net must EXCLUDE rou_asset (bs_totals sums both)
      - dta
      - other_nca                   # → alias: other_non_current_assets
      - total_non_current_assets    # subtotal (computed if missing)
      # Current Liabilities
      - taxes_payable               # sign: if negative → tax receivable → move to other_current_assets
      - interest_payable            # from Note 19 (within loans line), NOT within trade payables
      - payroll_payable             # → alias: payroll_and_benefits_payable
      - lease_liab_current          # from notes; accounts_payable must EXCLUDE this
      - dividends_payable
      - other_cl                    # → alias: other_current_liabilities
      - total_current_liabilities   # subtotal (computed if missing)
      # Non-Current Liabilities
      - dtl
      - employee_benefits           # sign: always positive (abs); from Note 20 provisions
      - lease_liab_noncurrent       # from notes; other_ncl must EXCLUDE this
      - other_ncl                   # → alias: other_non_current_liabilities
      - total_non_current_liabilities  # subtotal (computed if missing)
      - total_liabilities           # subtotal (computed if missing)
      # Equity
      - share_capital
      - apic
      - aoci                        # sign: can be negative (FX translation)
      - nci                         # sign: can be negative (subsidiary losses)
      - treasury_stock

  CF:
    sheet: history_cf
    format: legacy
    required_metrics:
      - cfo_total
      - cfi_total
      - cff_total
    key_optional:
      - cfo_net_income
      - cfo_da
      - cfo_before_wc
      - cfo_interest_paid
      - cfo_income_tax_paid
      - capex
      - cff_lt_debt_issuance
      - cff_lt_debt_repayment
      - cff_dividends

# ─── Canonical Sheets ────────────────────────────────────────────────────────

canonical:
  debt_instruments:
    sheet: debt_instruments
    key: instrument_id
    # 31 instruments: CNY bonds, RUB bonds, floating KeyRate+spread

  macro_factors:
    sheet: macro_factors
    key: factor_name
    # 22 factors: LME Al/Alumina, USD/RUB, Brent, GDP, CPI/PPI RU, Power

  segments_financial:
    sheet: segments_financial
    keys: [segment_name, metric]
    # 4 segments: Primary Aluminium, Alumina, Foil & Other, Other

  segments_operational:
    sheet: segments_operational
    keys: [segment_name, metric]
    # Production/sales volumes, avg prices, segment costs

  Production_KPI:
    sheet: production_kpi
    key: metric
    target: preprocess_metrics
    # 12 KPIs: production volumes, prices, segment revenues

# ─── Sign Convention ─────────────────────────────────────────────────────────
# IFRS "natural" signs: revenue/income = positive, expenses/costs = negative
# Configured in project.yaml → accounting_conventions.is_income_sign: natural
