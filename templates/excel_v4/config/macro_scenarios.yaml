# =============================================================================
# МАКРОСЦЕНАРИИ — единый SSOT для excel_v4 (книги) и Python engine (stressTest_v2)
#
# Винтаж: 2026-11-18. Все прогнозные значения имеют источник (source + url).
# Правило: Base = консенсус/официальный прогноз на дату винтажа; Stress = шок к Base;
# Severe = глубокий шок. История (hist_actuals) = [ДАННЫЕ], прогноз = [ОЦЕНКА].
#
# Использование:
#   - книги: templates/excel_v4/scripts/fill_data.py (fill_macro / fill_macro_forecasts)
#   - engine: engine/macro/scenario_config.py → macro_forecasts (method=scenario_base)
# =============================================================================

meta:
  vintage: "2026-11-18"
  fc_years: [2026, 2027, 2028]
  history_note: >
    История LME-металлов — номинальные среднегодовые cash-settlement (Westmetall/LME).
    2026 — частичный год (по 17.11.2026), [ДАННЫЕ].

# ─── Общие источники (шорткаты) ──────────────────────────────────────────────
sources:
  westmetall:   {name: "LME cash-settlement, Westmetall", url: "https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Al_cash", accessed: "2026-11-18"}
  wb_cmo:       {name: "World Bank Commodity Markets Outlook, Oct 2026", url: "https://documents1.worldbank.org/curated/en/099741210282619392/pdf/IDU-e91881a0-52ca-4623-a28d-63c23120bfcf.pdf", accessed: "2026-11-18"}
  cbr_survey:   {name: "Макроэкономический опрос Банка России, окт 2026", url: "https://cbr.ru/statistics/ddkp/mo_br/", accessed: "2026-11-18"}
  cbr_mtp:      {name: "Среднесрочный прогноз ЦБ РФ, 23.10.2026", url: "https://www.cbr.ru/press/keypr/", accessed: "2026-11-18"}
  minfin:       {name: "Бюджетные допущения Минфина / прогноз ПСР (бюджет 2026-2028)", url: "http://government.ru/news/59963/", accessed: "2026-11-18"}
  ecb_staff:    {name: "ECB staff projections, Sep 2026", url: "https://www.centralbank.ie/statistics/interest-rates-exchange-rates/ecb-interest-rates", accessed: "2026-11-18"}
  imf_weo:      {name: "IMF World Economic Outlook, Oct 2026", url: "https://www.imf.org/en/Publications/WEO", accessed: "2026-11-18"}
  focus_alumina: {name: "LME Alumina (Platts) via FocusEconomics", url: "https://www.focus-economics.com/commodities/base-metals/alumina/", accessed: "2026-11-18"}
  lme_nickel:   {name: "LME Nickel official, 17.11.2026", url: "https://www.lme.com/metals/non-ferrous/lme-nickel", accessed: "2026-11-18"}
  inn_pgm:      {name: "INN Palladium Forecast 2026 + spot (Kitco/TE 17.11.2026)", url: "https://investingnews.com/palladium-forecast/", accessed: "2026-11-18"}
  rosstat:      {name: "Росстат ИПЦ/ИЦП", url: "https://rosstat.gov.ru/", accessed: "2026-11-18"}

