# UC RUSAL
# ═════════════════════════════════════════════════════════════════════════════
rusal:
  # Фактические исторические значения в строках сценариев (C:E = 2023-2025)
  hist_actuals:
    2023: {"LME Aluminium": 2148, "LME Alumina": 349, "USD/RUB": 85.5, "USD/CNY": 7.08, "Brent": 82.2, "CPI RU": 0.073, "PPI RU": 0.040}
    2024: {"LME Aluminium": 2438, "LME Alumina": 459, "USD/RUB": 92.3, "USD/CNY": 7.25, "Brent": 80.6, "CPI RU": 0.095, "PPI RU": 0.043}
    2025: {"LME Aluminium": 2561, "LME Alumina": 353, "USD/RUB": 83.8, "USD/CNY": 7.19, "Brent": 69.1, "CPI RU": 0.087, "PPI RU": 0.017}
  # Доля глинозёма в цене алюминия (CP.alumina_lme_ratio): факт 2025 = 353/2561
  alumina_lme_ratio: {value: 0.134, source: "LME Alumina Platts / LME Al, факт 2025", tag: "[ДАННЫЕ]"}
  scenarios:
    base:
      "LME Aluminium": {values: [3250, 3050, 2900],
        source: "LME cash 2026 YTD ≈ 3 270 (Westmetall, 17.11); WB CMO Oct-26: рекорды 2026, снижение 2027, остаётся высоким", tag: "[ОЦЕНКА]"}
      "USD/RUB": {values: [85, 95, 99],
        source: "Опрос ЦБ окт-26: 81.2 (2026); Минфин: 92.2 (2026); МЭР: 100.2 (2026)→106.0 (2028). Путь — середина коридора", tag: "[ОЦЕНКА]"}
      "USD/CNY": {values: [7.0, 6.9, 6.8],
        source: "Фиксинг PBoC/consensus: постепенное укрепление CNY", tag: "[ОЦЕНКА]"}
      "Brent": {values: [72, 70, 68],
        source: "Опрос ЦБ окт-26: $70 (2026, налоговая цена повышена); Минфин Urals $53 (2027); WB CMO baseline $91/79 — верхняя граница (конфликт БВ)", tag: "[ОЦЕНКА]"}
      "CPI RU": {values: [0.070, 0.055, 0.045],
        source: "ЦБ: возврат к цели ~4% в 2027-28; 2026 ≈ 7-8% (среднесрочный прогноз 23.10.2026)", tag: "[ОЦЕНКА]"}
      "PPI RU": {values: [0.045, 0.035, 0.030],
        source: "ИЦП Росстат: исторически > ИПЦ (металлургия, энергия); нормализация к ~3%", tag: "[ОЦЕНКА]"}
    stress:
      "LME Aluminium": {values: [2600, 2440, 2320], source: "Base × (1−20%)", tag: "[ОЦЕНКА]"}
      "USD/RUB": {values: [98, 108, 115], source: "Base + девальвация ~15-20%", tag: "[ОЦЕНКА]"}
      "USD/CNY": {values: [7.3, 7.2, 7.1], source: "Base + ослабление CNY", tag: "[ОЦЕНКА]"}
      "Brent": {values: [58, 56, 54], source: "Base × 0.8", tag: "[ОЦЕНКА]"}
      "CPI RU": {values: [0.090, 0.075, 0.065], source: "Base +2 п.п.", tag: "[ОЦЕНКА]"}
      "PPI RU": {values: [0.060, 0.050, 0.045], source: "Base +1.5 п.п.", tag: "[ОЦЕНКА]"}
    severe:
      "LME Aluminium": {values: [1950, 1830, 1740], source: "Base × (1−40%)", tag: "[ОЦЕНКА]"}
      "USD/RUB": {values: [110, 124, 129], source: "Base +30%", tag: "[ОЦЕНКА]"}
      "USD/CNY": {values: [7.0, 6.9, 6.8], source: "= Base (чисто ценовой шок)", tag: "[ОЦЕНКА]"}
      "Brent": {values: [45, 43, 42], source: "Уровень отсечения Минфина $50 с дисконтом", tag: "[ОЦЕНКА]"}
      "CPI RU": {values: [0.120, 0.100, 0.080], source: "Base +5 п.п.", tag: "[ОЦЕНКА]"}
      "PPI RU": {values: [0.085, 0.070, 0.060], source: "Base +4 п.п.", tag: "[ОЦЕНКА]"}
  # Факторы только для engine (в книге не отображаются)
  engine:
    cbr_key_rate: {values: [14.6, 11.5, 9.0], source: "ЦБ 23.10.2026: средняя 2026 = 14.6; 2027 = 10.5-12.5 (SberCIB base 12.5); 2028 ≈ 8.5-9", tag: "[ОЦЕНКА]"}
    cbr_key_rate_policy: {values: [14.0, 12.0, 9.0], source: "ЦБ: ставка на конец 2026 = 14.0 (заседание 23.10.2026); траектория снижения", tag: "[ОЦЕНКА]"}
    euribor_6m: {values: [2.6, 2.6, 2.3], source: "ECB staff proj Sep-26: депо 2.5% средняя 2026, 2.6% 2027, 2.3% 2028; Euribor 6M ≈ депо +10-15 б.п.", tag: "[ОЦЕНКА]"}
    gdp_ru: {values: [146755, 153800, 161100], source: "Номинальный ВВП РФ, руб. млн; МЭР/Минфин СПР: рост номинала ~5%/год (заменяет ECM-путь со снижением 2027-28)", tag: "[ОЦЕНКА]"}

